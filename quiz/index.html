<style>
/* ------------------------------------------------------------------ tokens
   Herdados de app/ui_tokens.py, nao inventados. Aquele ficheiro tem os
   contrastes MEDIDOS (16:1 / 9:1 / 5,4:1 sobre o fundo), e uma segunda
   paleta a competir com a primeira e exactamente o defeito que a v3 do
   painel pagou caro. O tema claro deriva dos mesmos tons, escurecidos para
   aguentarem o minimo de 4,5:1 sobre branco. */
:root {
  --bg:#0B0E13; --panel:#131820; --panel2:#1A2029; --line:#242C38;
  --fg:#EDF1F7; --dim:#A3AEC2; --mute:#7C8AA3;
  --ok:#00D68F; --no:#FF5A5F; --flag:#FFB020; --info:#4A9EFF;
  --shadow:0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.45);
  --r:14px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#F5F7FA; --panel:#FFFFFF; --panel2:#EDF1F6; --line:#D5DDE7;
    --fg:#0F141B; --dim:#48566B; --mute:#63728A;
    --ok:#00885C; --no:#C8353A; --flag:#9A6300; --info:#1F62C4;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
  }
}
:root[data-theme="light"] {
  --bg:#F5F7FA; --panel:#FFFFFF; --panel2:#EDF1F6; --line:#D5DDE7;
  --fg:#0F141B; --dim:#48566B; --mute:#63728A;
  --ok:#00885C; --no:#C8353A; --flag:#9A6300; --info:#1F62C4;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
}
:root[data-theme="dark"] {
  --bg:#0B0E13; --panel:#131820; --panel2:#1A2029; --line:#242C38;
  --fg:#EDF1F7; --dim:#A3AEC2; --mute:#7C8AA3;
  --ok:#00D68F; --no:#FF5A5F; --flag:#FFB020; --info:#4A9EFF;
  --shadow:0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.45);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:17px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap { max-width:640px; margin:0 auto; padding:14px 14px 0; }

/* ------------------------------------------------------------------ topo */
header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.mark { width:26px; height:26px; flex:0 0 auto; }
h1 { font-size:15px; font-weight:650; letter-spacing:.01em; margin:0; flex:1; }
h1 small { display:block; font-weight:400; font-size:11.5px; color:var(--mute);
  letter-spacing:.06em; text-transform:uppercase; }
.iconbtn {
  background:var(--panel); border:1px solid var(--line); color:var(--dim);
  border-radius:9px; width:34px; height:34px; font-size:15px; cursor:pointer;
}
.iconbtn:active { background:var(--panel2); }

/* ---- barra de progresso: uma marca por pergunta.
   E a mesma ideia visual da "tira de excedencias" da tese (5 dos ultimos 249
   dias): em vez de uma percentagem abstracta, mostra as unidades reais. */
.strip { display:flex; gap:2px; height:7px; margin:10px 0 4px; }
.tick { flex:1 1 0; min-width:0; border-radius:2px; background:var(--line); transition:background .18s; }
.tick.ok { background:var(--ok); }
.tick.no { background:var(--no); }
.tick.now { background:var(--fg); }
.meta {
  display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:11.5px; color:var(--mute); font-variant-numeric:tabular-nums;
  letter-spacing:.02em; margin-bottom:12px;
}

/* ------------------------------------------------------------------ cartao */
.card {
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:18px 16px; margin-bottom:12px;
}
.tags { display:flex; gap:6px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.tag {
  font-family:var(--mono); font-size:10.5px; letter-spacing:.07em;
  text-transform:uppercase; padding:3px 7px; border-radius:5px;
  border:1px solid var(--line); color:var(--mute); white-space:nowrap;
}
.tag.t1 { color:var(--flag); border-color:color-mix(in srgb, var(--flag) 40%, var(--line)); }
.tag.t2 { color:var(--info); border-color:color-mix(in srgb, var(--info) 40%, var(--line)); }
.tag.t3 { color:var(--mute); }
.q { font-size:19.5px; line-height:1.36; font-weight:600; margin:0 0 4px;
  text-wrap:balance; }
.hint { font-size:13.5px; color:var(--mute); margin-top:10px; }

.answer {
  margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
  font-size:16px; color:var(--dim); line-height:1.55;
}
.answer strong, .answer b { color:var(--fg); font-weight:650; }
.answer code, .num {
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  background:var(--panel2); padding:1px 5px; border-radius:4px;
  font-size:.92em; color:var(--fg);
}
.answer ul { margin:8px 0 0; padding-left:19px; }
.answer li { margin:5px 0; }
.answer p { margin:9px 0 0; }
.answer p:first-child { margin-top:0; }

/* -------------------------------------------------------------- escolhas */
.opts { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
.opt {
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--panel2); border:1px solid var(--line); color:var(--fg);
  border-radius:10px; padding:13px 14px; font:inherit; font-size:16.5px;
  cursor:pointer; transition:border-color .15s, background .15s;
}
.opt .val { font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; }
.opt:disabled { cursor:default; }
.opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--panel2)); }
.opt.wrong { border-color:var(--no); background:color-mix(in srgb, var(--no) 12%, var(--panel2)); }
.opt .badge { margin-left:auto; font-family:var(--mono); font-size:12px; }
.opt.right .badge { color:var(--ok); }
.opt.wrong .badge { color:var(--no); }

/* ----------------------------------------------------------- accoes/base */
.actions { display:flex; gap:8px; margin-bottom:14px; }
button.big {
  flex:1; padding:15px 12px; border-radius:11px; font:inherit; font-size:16px;
  font-weight:600; cursor:pointer; border:1px solid var(--line);
  background:var(--panel); color:var(--fg); min-height:52px;
}
button.big:active { transform:translateY(1px); }
button.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }
button.yes { border-color:color-mix(in srgb,var(--ok) 55%,var(--line)); color:var(--ok); }
button.no  { border-color:color-mix(in srgb,var(--no) 55%,var(--line)); color:var(--no); }
button:focus-visible, .opt:focus-visible, .iconbtn:focus-visible, select:focus-visible {
  outline:2px solid var(--info); outline-offset:2px;
}

/* -------------------------------------------------------------- filtros */
.filters { display:flex; gap:8px; margin-bottom:12px; }
select {
  flex:1; background:var(--panel); color:var(--dim); border:1px solid var(--line);
  border-radius:9px; padding:9px 10px; font:inherit; font-size:13.5px;
}
.done {
  text-align:center; padding:28px 16px;
}
.done .score {
  font-family:var(--mono); font-size:46px; font-weight:700; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; margin:6px 0;
}
.done .sub { color:var(--dim); font-size:15px; line-height:1.5; }
.miss { text-align:left; margin-top:18px; }
.miss h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--mute); margin:0 0 8px; font-weight:600; }
.miss li { margin:6px 0; color:var(--dim); font-size:14.5px; }
footer {
  text-align:center; color:var(--mute); font-size:11.5px; padding:16px 14px 26px;
  line-height:1.6;
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

<script>
"use strict";

/* =====================================================================
   BANCO DE PERGUNTAS

   Regra: nada aqui e inventado. Cada numero vem de docs/evaluation/*.md,
   do autoteste.md ou do registo do projecto. Se um numero mudar na tese,
   muda aqui -- e a resposta certa da escolha multipla tem de ser a real,
   nunca a mais bonita.

   tipo "aberta": responde-se em voz alta e auto-avalia-se. E o formato que
   treina a defesa, porque na sala ninguem da opcoes.
   tipo "escolha": auto-corrigida. So para NUMEROS, que sao o unico sitio
   onde ha uma resposta objectiva e onde a hesitacao se nota mais.
   ===================================================================== */
const BANCO = [
/* --------------------------------------------------- 1. o que isto e */
{b:"O que isto é", n:1, t:"aberta", q:"Em três frases, o que é o InvestiGator?",
 a:`Um sistema de alertas financeiros <b>explicáveis</b> para investidores de retalho.
 Responde a três perguntas quando uma acção se mexe: <b>é invulgar para esta acção?</b>,
 <b>é a empresa ou o mercado?</b> e <b>já aconteceu antes, e o que se seguiu?</b>
 <p>Nunca prevê preços — e isso é uma restrição de desenho, não uma falha.</p>`},

{b:"O que isto é", n:1, t:"aberta", q:"Qual é a contribuição, se todos os modelos já existiam?",
 a:`A <b>integração avaliada</b>. Nenhum algoritmo é novo. O que é novo é um sistema que
 responde às três perguntas a custo zero, com cada afirmação rastreável ao procedimento que
 a produziu, e com os resultados negativos reportados tal como caíram.
 <p>É isso que engenharia de IA é: integrar, aplicar e avaliar criticamente.</p>`},

{b:"O que isto é", n:2, t:"aberta", q:"Porque é que recusar prever é uma força e não uma desculpa?",
 a:`Porque a hipótese de mercado eficiente diz que a informação pública é absorvida quase de
 imediato — logo prever retornos a partir de notícia pública é dificílimo por construção.
 <p>Em vez de competir com isso e falhar, o sistema <b>mede e explica o que já aconteceu</b>
 depois de notícias comparáveis. É mais honesto e muito mais defensável.</p>`},

/* ------------------------------------------------------- 2. conceitos */
{b:"Conceitos de IA", n:1, t:"aberta", q:"O que é um embedding, e porque é preciso?",
 a:`Um vector de números que representa o <b>significado</b> de uma frase. É preciso porque um
 computador não compara texto por significado, só por caracteres.
 <p>Com vectores, <i>"escassez de chips"</i> fica perto de <i>"problemas no fornecimento de
 semicondutores"</i> mesmo sem uma palavra em comum.</p>`},

{b:"Conceitos de IA", n:1, t:"aberta", q:"Porquê cosseno e não distância euclidiana?",
 a:`Porque interessa a <b>direcção</b> do vector (o tema), não o comprimento. E como os
 embeddings são normalizados a norma 1, o cosseno é simplesmente o produto interno — e a
 ordenação por cosseno e por distância euclidiana passa a ser <b>a mesma</b>.
 <p>É a escolha barata e correcta, e sabes justificá-la nas duas direcções.</p>`},

{b:"Conceitos de IA", n:1, t:"aberta", q:"Escreve o z-score e explica porque se normaliza.",
 a:`<code>z_t = (r_t − μ_t) / σ_t</code>, anomalia se <code>|z_t| > k</code>.
 <p>Normaliza-se pela volatilidade <b>da própria acção</b> porque a mesma queda de 3% é
 dramática numa acção calma e banal numa volátil. Um limiar fixo em percentagem trataria as
 duas de igual maneira — e é exactamente isso que a medição mostra que corre mal.</p>`},

{b:"Conceitos de IA", n:2, t:"aberta", q:"O que significa \"sem lookahead\" e como o garantes?",
 a:`Que nenhum número usado para decidir hoje vem do futuro. A janela do z-score usa só dias
 <b>anteriores</b>; o impacto é medido estritamente <b>depois</b> do fecho do dia do evento.
 <p>E não é só uma afirmação: há um teste que <b>muta os preços futuros</b> — as features não
 podem mudar, o rótulo tem de mudar. Se alguém introduzir lookahead, o teste parte.</p>
 <p><b>Limite:</b> esta é uma garantia ao fecho diário. <code>ret_event</code> é o retorno completo
 de hoje no treino e ainda não existe quando uma notícia chega intradia; portanto o teste não
 demonstra paridade entre treino e produção nesse instante.</p>`},

{b:"Conceitos de IA", n:2, t:"aberta", q:"O que é precision@k e porquê essa métrica?",
 a:`A fracção dos <code>k</code> primeiros resultados que são relevantes.
 <p>É a métrica certa porque um alerta só mostra três ou cinco precedentes: o que interessa é
 se os do <b>topo</b> prestam, não a lista toda.</p>`},

{b:"Conceitos de IA", n:3, t:"aberta", q:"O que é um event study?",
 a:`Medir o retorno numa janela curta <b>depois</b> de um acontecimento — aqui +1, +3 e +5 dias
 a contar do fecho do dia do evento.
 <p>Descreve um <b>resultado observado</b>. Nunca um efeito causal, nunca uma previsão.</p>`},

{b:"Conceitos de IA", n:2, t:"aberta", q:"Porque é que a raridade é uma CONTAGEM e não uma probabilidade?",
 a:`Converter um z-score numa probabilidade exige assumir <b>normalidade</b>. Os retornos têm
 <b>caudas pesadas</b>, portanto essa probabilidade estaria errada precisamente nos dias que
 interessam — os extremos.
 <p>A contagem empírica não assume nada: <i>"só 5 dos últimos 249 dias se moveram assim"</i>.
 E um leigo lê isso sem saber estatística nenhuma.</p>`},

/* --------------------------------------------------------- 3. numeros */
{b:"Os números", n:1, t:"escolha",
 q:"Amplitude da taxa de disparo entre os 15 tickers, no z-score:",
 opts:["0,015","0,344","0,126","0,530"], ok:0,
 a:`<b>0,015</b> no z-score contra <b>0,344</b> no limiar fixo.
 <p>É o argumento mais forte da detecção porque <b>não precisa de rótulo nenhum</b>: mostra
 consistência em acções de volatilidade muito diferente.</p>`},

{b:"Os números", n:1, t:"escolha",
 q:"P@5 da recuperação semântica (MiniLM), no protocolo congelado:",
 opts:["0,346","0,514","0,595","0,240"], ok:1,
 a:`<b>0,514</b> com o MiniLM, contra <b>0,346</b> lexical, <b>0,240</b> aleatório e
 <b>0,126</b> recência.
 <p>Cuidado com a confusão fácil: <b>0,595</b> é o teste <b>simétrico à escala</b>, medido em
 80 mil títulos do FNSPID, mas permite candidatos posteriores. A tarefa causal do produto dá
 <b>0,513</b> contra chão <b>0,259</b>, margem <b>+0,254</b>.</p>
 <p>⚠️ E não digas &laquo;mais do dobro do acaso&raquo;. O chão de <b>0,240</b> é o do acaso
 uniforme, e há um melhor: metade do corpus é tecnologia, portanto <b>devolver sempre
 tecnologia</b> vale <b>0,467</b> sem modelo nenhum. A margem real é <b>+0,047</b>.</p>
 <p>A resposta forte é a seguir a isso: essa alternativa acerta em tudo num setor e em
 <b>nada</b> nos outros quatro. <b>Dentro</b> de cada setor o método ganha nos cinco, e na
 energia dá <b>0,448</b> contra um chão de <b>0,072</b>.</p>`},

{b:"Os números", n:1, t:"escolha",
 q:"RQ4 — PR-AUC da volatilidade sozinha (a linha de base que ninguém bateu):",
 opts:["0,496","0,538","0,542","0,439"], ok:2,
 a:`<b>volatilidade 0,542</b> &gt; contexto 0,538 &gt; contexto+texto <b>0,496</b>.
 <p>Acrescentar o texto da manchete <b>piora</b>. O sinal vive no contexto de mercado, não no
 título — e isto foi <b>pré-comprometido</b>: a linha de base foi escolhida antes de correr.</p>`},

{b:"Os números", n:1, t:"escolha",
 q:"Precisão da triagem dentro de um orçamento de 5 alertas/dia (vs 0,379 de uma ordenação aleatória):",
 opts:["0,632","0,542","0,667","0,595"], ok:0,
 a:`<b>0,632</b> contra <b>0,379</b> de ordenar ao acaso — sobe 1,67×. O <b>0,163</b> que esta tese citava era o chão de "alertar-sempre", e não media escolher às cegas: com pontuação constante o desempate segue a ordem do ficheiro, que é alfabética.
 <p>É um ganho <b>offline</b> no proxy, não utilidade humana nem eficácia causal ao vivo. Como a
 política vê o dia inteiro antes de escolher cinco, funciona como <b>limite superior</b> da
 política online. A resposta ao <i>"o vosso modelo perdeu"</i> tem de conservar esta ressalva.</p>`},

{b:"Os números", n:2, t:"escolha",
 q:"Anomalia — F1 do z-score contra Isolation Forest e LOF, com a mesma informação causal:",
 opts:["0,530 / 0,271 / 0,280","0,664 / 0,516 / 0,500","0,542 / 0,496 / 0,439","0,712 / 0,444 / 0,358"], ok:0,
 a:`z-score <b>F1 0,530</b>, Isolation Forest <b>0,271</b>, LOF <b>0,280</b>.
 <p>É a primeira das duas comparações "estatístico contra aprendido", e a opção transparente
 ganhou. A segunda é a RQ4, onde nenhum modelo com texto bate a volatilidade.</p>`},

{b:"Os números", n:2, t:"escolha",
 q:"O achado honesto que vai CONTRA a escolha feita — EWMA vs deslizante:",
 opts:["F1 0,664 vs 0,516","F1 0,530 vs 0,271","PR-AUC 0,542 vs 0,538","P@5 0,595 vs 0,514"], ok:0,
 a:`A volatilidade <b>EWMA bate a deslizante: F1 0,664 contra 0,516</b>, com o mesmo recall e
 quase metade dos falsos positivos.
 <p>Reportei-o. Mantenho a deslizante por ser explicável numa frase, e a EWMA fica como
 <b>trabalho futuro já validado</b>. Reportar o que contraria a nossa escolha é o que dá
 crédito a tudo o resto.</p>`},

{b:"Os números", n:1, t:"escolha",
 q:"Ao vivo, sobre 530 decisões maturadas, os alertas MANTIDOS foram materiais:",
 opts:["0,592 — MENOS do que os suprimidos (0,647)","0,667 — mais do que a taxa de base",
       "0,632 — como no conjunto de teste","0,900 — quase sempre"], ok:0,
 a:`<b>0,592 contra 0,647 nos suprimidos.</b> O gate ficou do lado errado, e a diferença não é
 significativa (z=−1,28, p=0,20) — portanto a leitura certa é <i>«não seleciona melhor do que o
 acaso»</i>, e não <i>«faz mal»</i>.
 <p>⚠️ Uma versão antiga deste autoteste dizia <b>0,667 vs 0,455</b>. Era verdade sobre <b>12</b>
 decisões, e o intervalo de confiança dessas 12 ia de 0,39 a 0,86 — continha a taxa de base. Não
 provava nada. Com a amostra inteira o sinal <b>inverte-se</b>. Se disseres o número antigo numa
 defesa e te perguntarem o intervalo, acabou.</p>`},

{b:"Os números", n:2, t:"escolha",
 q:"Porque é que RECALIBRAR não resolveria o gate ao vivo?",
 opts:["Porque a calibração é monótona: preserva a ordem",
       "Porque não há dados rotulados suficientes",
       "Porque o modelo é demasiado pequeno",
       "Porque a prevalência ao vivo é mais baixa"], ok:0,
 a:`<b>Porque a sigmóide de Platt é crescente</b> — muda os números, nunca troca quem fica à
 frente de quem. Se a ordenação estiver ao nível do acaso (ROC-AUC <b>0,486</b>, IC
 [0,403, 0,571]), recalibrar melhora o Brier e <b>não muda uma única decisão</b> do gate.
 <p>Esta distinção — discriminação contra calibração — é a coisa mais técnica que tens para
 mostrar, e a ferramenta de recalibração <b>recusa-se a correr</b> por causa dela.</p>`},

/* --------------------------------------------- 3b. depois de treinado */
{b:"Depois de treinado", n:1, t:"aberta",
 q:"Inferência, treino, re-treino, aprendizagem contínua: o que é cada uma NO TEU sistema?",
 a:`<b>Inferência</b>: pontuar com pesos fixos — corre a cada 60 s no worker.
 <b>Treino</b>: descobrir os pesos — aconteceu <b>uma vez</b>, offline, e produziu um ficheiro.
 <b>Re-treino</b>: repetir com dados novos — possível, documentado, <b>nunca executado</b>.
 <b>Aprendizagem contínua</b>: re-treino automático — <b>não existe</b>.
 <p>Confundi-las é a forma mais rápida de perder credibilidade. Diz as quatro por ordem.</p>`},

{b:"Depois de treinado", n:1, t:"aberta",
 q:"«O sistema aprende com os alertas que envia?»",
 a:`<b>Não.</b> O que corre continuamente é <b>recolha de rótulos e monitorização</b>: cada
 decisão é registada e, dias depois, rotulada com o que aconteceu ao preço pela mesma regra do
 treino. Nenhum peso muda.
 <p>É a <b>pré-condição</b> de um re-treino, não um re-treino. Chamar-lhe aprendizagem contínua
 seria exagero — e um arguente que peça para ver o código do ciclo automático não o encontra.</p>`},

{b:"Depois de treinado", n:2, t:"escolha",
 q:"Onde está o modelo treinado, concretamente?",
 opts:["Num ficheiro .joblib de 1,8 KB no repositório, com um .json de metadados ao lado",
       "Numa base de dados na nuvem","Dentro do código Python, como constantes",
       "É descarregado do Hugging Face a cada arranque"], ok:0,
 a:`Um <b>.joblib</b> com os pesos e um <b>.json</b> ao lado com a semente, os tamanhos dos
 blocos, a prevalência e as métricas de teste. Esse par <b>é</b> um registo de modelos, ainda que
 pequeno: consegue-se dizer que dados produziram aqueles pesos.
 <p>O SBERT é o caso diferente — esse é descarregado, e verificado contra um <b>SHA256 fixo</b>,
 para um download corrompido falhar fechado em vez de mudar em silêncio o que é «parecido».</p>`},

{b:"Depois de treinado", n:2, t:"aberta",
 q:"«Como sabem que o modelo avaliado é o que está a correr?»",
 a:`Duas respostas, e a segunda é a que conta. Primeiro: <i>é literalmente o mesmo ficheiro.</i>
 <p>Segundo: <b>há um teste</b> que carrega o ficheiro implantado, recalcula PR-AUC, ROC-AUC,
 Brier e precisão-no-orçamento sobre o mesmo bloco, e exige igualdade <b>exacta</b>. Se alguém
 re-treinar com outra semente, a suite parte. Não é preciso acreditar em mim.</p>`},

{b:"Depois de treinado", n:2, t:"escolha",
 q:"PSI 0,281 na volatilidade pré-evento quer dizer:",
 opts:["Deriva significativa (a banda convencional começa em 0,25)",
       "Deriva desprezável","Que o modelo está mal treinado","Que os dados estão corrompidos"], ok:0,
 a:`Banda <b>significativa</b> (&lt;0,10 estável, 0,10–0,25 moderado, &gt;0,25 significativo).
 A janela de treino contém o choque de 2020: o modelo aprendeu num mundo mais turbulento.
 <p>Pormenor que mostra que olhaste: a prevalência do rótulo <b>oscila</b> (0,385 → 0,470 →
 0,378) em vez de derivar. Comparar só as pontas esconderia uma excursão de um quinto.</p>`},

{b:"Depois de treinado", n:3, t:"aberta",
 q:"Se quisesses que o modelo melhorasse com o tempo, o que farias — e porque não fizeste?",
 a:`O mecanismo já está: <b>825</b> decisões maturadas, agrupadas em <b>239</b> pares empresa-dia.
 O passo seguinte seria re-ajustar <b>só a camada de calibração</b> (dois parâmetros). Re-treinar
 os nove coeficientes sobre grupos tão dependentes seria
 ajustar ruído com aparência de método.
 <p>E o remate: <b>medi antes de fazer, e a medição disse para não fazer.</b> A ferramenta existe
 e recusa-se a escrever enquanto a discriminação não superar o acaso.</p>`},

/* ------------------------------------------------- 4. os quatro "nao" */
{b:'Os cinco «não»', n:1, t:"aberta", q:"Taxonomia de eventos: o número, e porque NÃO a ligaste?",
 a:`AMI <b>0,358</b> com tipo de evento contra <b>0,188</b> com ticker: o espaço sabe o
 acontecimento, e sabe-o <b>mais</b> do que sabe a empresa. Bonito.
 <p>Mas a silhueta é <b>0,084</b> — os grupos sobrepõem-se — e a rubrica só cobre <b>15,1%</b>
 do corpus. Filtrar por um tipo errado <b>remove evidência válida em silêncio</b>, e é isso
 que o critério H4 proíbe.</p>`},

{b:'Os cinco «não»', n:1, t:"escolha",
 q:"Pureza 0,712 parece boa. Que valor daria uma atribuição ALEATÓRIA com os mesmos tamanhos?",
 opts:["0,444","0,188","0,084","0,358"], ok:0,
 a:`<b>0,444</b>. Com um tipo a valer 44% dos rótulos e 18 grupos, o acaso já lá chega quase.
 <p>O ganho real é <b>+0,269</b>, não 0,712. É a lição de método mais transferível da tese:
 <b>uma métrica sem a sua linha de base não é um resultado.</b></p>`},

{b:'Os cinco «não»', n:1, t:"escolha",
 q:"Para garantir 90% de cobertura conformal, em que fracção das manchetes há decisão definida?",
 opts:["39,5%","90,0%","63,2%","15,1%"], ok:0,
 a:`<b>39,5%</b> — o número mais duro da tese.
 <p>Não contradiz a RQ4: <b>explica-a</b> por um caminho independente, e sem treinar nada.
 Se te perguntarem "o vosso sistema é confiante?", esta é a resposta honesta.</p>`},

{b:'Os cinco «não»', n:2, t:"aberta", q:"A cobertura conformal parte-se onde, e porquê?",
 a:`Aguenta a <b>90%</b> e a <b>80%</b>; parte-se a <b>95%</b> sob divisão temporal
 (<code>0,937</code> contra 0,95).
 <p>Porquê: pedir 95% obriga o limiar a apoiar-se na <b>cauda</b> da calibração — e é a cauda
 que se move primeiro quando o regime muda.</p>`},

{b:'Os cinco «não»', n:1, t:"aberta", q:"Deriva: o que está medido, e o que isso muda?",
 a:`Volatilidade pré-evento <b>PSI 0,281</b> (banda significativa); features de retorno
 <code>0,020</code> e <code>0,014</code> (estáveis).
 <p>Muda o estatuto da afirmação: a limitação que a tese repetia passou de <b>afirmada a
 medida</b>, e passa a dar um gatilho de re-treino verificável em vez de uma intuição.</p>`},

{b:'Os cinco «não»', n:2, t:"aberta", q:"Porque é que os números congelados sobrevivem à deriva?",
 a:`Porque a prevalência do rótulo <b>oscila</b> em vez de ter tendência:
 <code>0,385 → 0,470 → 0,378</code>.
 <p>O protocolo já atravessa uma dessas oscilações — logo os números foram medidos <b>sob</b>
 deriva, não antes dela.</p>`},

{b:'Os cinco «não»', n:1, t:"aberta", q:"Convergência: o resultado, e o achado que vale mais do que o resultado.",
 a:`A fusão ganha em <b>1 de 3</b> orçamentos. Um ganho que depende do orçamento que se cita é
 um ganho que se <b>pode ter escolhido</b> ⇒ não entra em produção.
 <p>O achado que vale mais: o peso da intensidade de notícia saiu <b>negativo (−0,283)</b>.
 Mais manchetes = <b>menos</b> provável ser material, porque são dias de conteúdo automático.
 À mão eu teria posto positivo, e estaria errado. É a justificação empírica de derivar pesos
 em vez de os arbitrar.</p>`},

/* -------------------------------------------- 5. metodo e integridade */
{b:"Método e integridade", n:1, t:"aberta", q:"Como sabes que as tuas citações não são inventadas?",
 a:`<b>59 de 59</b> verificadas, e por <b>script</b>:
 <code>scripts/verify_bibliography.py</code> resolve cada identificador contra o Crossref/arXiv
 e compara campo a campo — 44 DOIs, 7 arXiv, 7 URLs, 1 ISBN.
 <p>A comparação de títulos apanha o caso mais perigoso: um DOI que resolve para <b>outro</b>
 artigo. E há uma <b>rejeição</b> documentada — o MacKinlay 1997 saiu porque o DOI não resolve.</p>`},

{b:"Método e integridade", n:2, t:"aberta", q:"O que é que a verificação automática apanhou de facto?",
 a:`Três coisas reais:
 <ul>
 <li>O <b>FNSPID</b> — o conjunto de dados de que a tese depende — estava citado como
 pré-publicação arXiv quando já existe versão revista por pares no <b>KDD '24</b>.</li>
 <li>O <b>LOF</b> declarava as actas do SIGMOD, mas o DOI resolvia para a revista
 <i>SIGMOD Record</i>. Identificador trocado.</li>
 <li>O <b>Sculley 2015</b> era a única entrada sem identificador nenhum — o que contraria o
 protocolo do próprio projecto.</li>
 </ul>
 <p>E a parte honesta: a primeira corrida deu <b>33 achados e 30 eram defeito do verificador</b>,
 não da bibliografia.</p>`},

{b:"Método e integridade", n:2, t:"aberta", q:"E como sabes que as citações SUSTENTAM o que dizes?",
 a:`É uma auditoria <b>separada</b>, porque são perguntas diferentes: uma fonte pode ser
 perfeitamente real e mesmo assim estar mal aplicada.
 <p>Li as <b>122 instâncias</b> contra o que a obra estabelece. Encontrei duas afirmações
 esticadas e corrigi-as <b>enfraquecendo a afirmação</b>, nunca inventando fonte: um survey de
 2014 a que atribuía modelos de 2019, e um critério atribuído a autores que não o elegem.</p>`},

{b:"Método e integridade", n:2, t:"aberta", q:"Como é que a explicação não pode divergir do cálculo?",
 a:`Porque o texto é <b>composto a partir dos mesmos objectos</b> que o sistema calcula — não
 há um segundo caminho que possa desalinhar.
 <p>E há teste: cada precedente mostrado tem de aparecer com a data, ticker e similaridade
 exactos, e não pode aparecer nenhum que não tenha sido recuperado.</p>`},

{b:"Método e integridade", n:3, t:"aberta", q:"Tens base de dados?",
 a:`Três camadas: <b>SQLite</b> para as subscrições do bot, <b>JSONL versionado</b> para o
 histórico partilhado, e os modelos com metadados.
 <p>Não há <b>servidor</b> de base de dados porque o acesso é acrescentar-e-ler-tudo sobre
 24 MB, e versionar dá rasto de auditoria e leitura pública. A limitação é a escrita
 concorrente, tratada com controlo optimista — e digo-o.</p>`},

/* ----------------------------------- 6. decisoes (prova que foste tu) */
{b:"Decisões que tomei", n:1, t:"aberta",
 q:"Porque é que a watchlist passou de 10 para 12, e porque são as duas novas NÃO tecnológicas?",
 a:`Porque <b>nove dos dez</b> nomes anteriores partilhavam o mesmo ETF de sector (XLK). A
 pergunta <i>"foi o sector?"</i> vinha quase sempre com a mesma resposta — <b>não por ser essa
 a resposta, mas por falta de variedade</b>.
 <p>Entraram a <b>XOM</b> (energia, XLE) e a <b>JNJ</b> (saúde, XLV). O efeito apareceu logo:
 <b>XOM −0,98% num dia em que o sector fez +0,93%</b> — o sector a puxar ao contrário, coisa
 que nove nomes tecnológicos nunca poderiam ter mostrado.</p>
 <p>É uma melhoria de <b>avaliação</b>, não de ecrã.</p>`},

{b:"Decisões que tomei", n:1, t:"aberta",
 q:"O defeito de honestidade que apanhaste ao olhar para a Figura 4.5. Qual foi?",
 a:`A <b>Microsoft com +4,82%</b> e o cartão a dizer <i>"an ordinary day"</i>.
 <p>Verificado: <code>z = +1,11</code>, abaixo do limiar — mas <b>5 dos 249 dias</b> moveram-se
 assim. Um movimento no <b>top 2% do ano</b> descrito como banal.</p>
 <p>Causa: as duas réguas medem coisas diferentes (o detector olha 20 dias, a contagem olha o
 ano) e a interface resolvia a discordância <b>escolhendo em silêncio a palavra mais
 tranquilizadora</b>. Agora diz as duas. <b>Nenhum log mostraria isto</b> — só olhar para a
 figura.</p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"Porque é que o narrador usa uma ALLOWLIST e não uma lista de palavras proibidas?",
 a:`Porque uma blocklist de linguagem natural <b>perde sempre</b>: as paráfrases são infinitas
 e a lista é finita. Um red team de três adversários abriu <b>29 furos</b> na primeira versão —
 incluindo apóstrofos de contracções (<i>it's</i>) lidos como aspas, criando "citações" falsas.
 <p>A v2 inverte: vocabulário fechado (~360 palavras neutras), negativos só válidos <b>com
 sinal</b>, atribuição validada contra a evidência. Os 21 exploits ficaram como regressão
 permanente — 21/21 bloqueados.</p>
 <p>E a prova de que a lição é real: o mesmo erro voltou <b>ao contrário</b> num teste, que
 acusou "price target" numa frase que dizia <i>"No price targets"</i>.</p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"Porque é que o β não é cortado a ±4, e o que puseste no lugar?",
 a:`Porque um corte rígido é <b>exactamente a constante por justificar</b> que o projecto está a
 corrigir noutros sítios. E fazia mal: a AMD deu <code>β = 4,43</code>, caía num recurso
 silencioso de β=1, e atribuía os <b>−8,5% inteiros à empresa</b>.
 <p>No lugar: <b>encolhimento de Vasicek</b>, ponderado pela <b>precisão</b> da estimativa. Um
  β bem medido fica; um mal medido é puxado para o prior correspondente (1 no mercado, 0 no setor
  ortogonalizado). Um peso fixo (Blume, ⅔) também não
 servia — encolhia um β exacto de 2,0 para 1,67.</p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"Mediste que o chip de precedentes na grelha custava quanto? E o que isso te ensinou?",
 a:`A grelha a frio passava de <b>6,2 s para 13,7 s</b> — sete segundos e meio por um chip,
 contra um critério que pede menos de cinco no total. Não entrou.
 <p>E o mais instrutivo foi a <b>caça à causa</b>: componente a componente a coisa custava
 ~3,2 s, mas dentro do Streamlit custava mais do dobro. Andei pelo pickle da cache (0,19 s,
 não era) e pelo parse do backfill (0,24 s, não era) até fazer a experiência que decide —
 tirar só o chip e medir.</p>
 <p><b>A soma das partes medidas isoladamente não é a medição do todo.</b></p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"Um teste que passava e mesmo assim estava errado. Dá o exemplo.",
 a:`<code>test_watchlist_completa_tem_aliases</code> tinha os <b>dez nomes escritos à mão</b>.
 Quando a watchlist cresceu para doze, o teste <b>continuava a passar</b> — cobria os dez
 antigos e ignorava os dois novos, sem nunca falhar.
 <p>Passou a ler o <code>config/alerts.yaml</code>. A lição: um teste que não pode falhar quando
 o sistema muda não está a testar o sistema, está a testar uma cópia dele.</p>
 <p>O irmão deste caso: o ecrã de detalhe abriu em 1D <b>sem nada para mostrar</b>, com todos os
 testes verdes — porque <b>um painel vazio é um painel válido</b> para os testes. Só a captura
 deu por isso.</p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"Porque é que o histórico de alertas NÃO foi limpo, mesmo tendo sido pedido?",
 a:`Porque os <b>220 alertas</b> são a única prova de <b>operação real</b>, e a latência medida
 e a pós-validação citadas na tese assentam neles. Limpá-los apagaria a evidência.
 <p>O replay histórico escreve para <b>outro ficheiro</b> e o gráfico distingue as camadas:
 ⚑ enviado · ○ detectado-mas-travado · ● notícia.
 <b>Um alerta reproduzido não é um alerta enviado</b>, e a interface não pode deixar
 confundir os dois.</p>`},

{b:"Decisões que tomei", n:1, t:"aberta",
 q:"O dia em que a NVDA subiu e o alerta nunca chegou. O que aconteceu, e o que é que isso revelou?",
 a:`O tecto diário (2 alertas por empresa) era servido por <b>ordem de chegada</b>. Duas
 histórias irrelevantes de manhã gastavam o orçamento e a notícia que moveu a acção era
 descartada à tarde <b>sem deixar rasto</b>.
 <p><b>O que isso revelou é a parte que interessa:</b> o sistema já tinha o instrumento certo. O
 modelo de triagem existe exactamente para ordenar por materialidade — dentro de um orçamento de
 5 alertas eleva a precisão de <code>0,379</code> para <code>0,632</code> — e o tecto
 <b>nunca o consultava</b>. A pontuação era medida e depois ignorada.</p>
 <p>⚠️ E a primeira correcção <b>não funcionou</b>, o que é a parte que vale a pena saber contar:
 ordenar só reordena candidatas presentes ao mesmo tempo, e a varredura emite <b>uma manchete por
 empresa por ciclo</b> — duas histórias a disputar a mesma quota nunca coexistem num lote. Ao longo
 do dia a ordem continuou a ser a de chegada.</p>
 <p>Quem governa o total é o <b>orçamento global de 5 alertas/dia</b>. Com ele ligado, o primeiro
 alerta de cada empresa fica <b>sem piso</b> e o segundo exige <code>0,64</code>. O
 <code>0,49</code> permanece apenas como proveniência do varrimento que derivou ambos os valores.
 O que isto não resolve, e nenhum algoritmo online resolve: o primeiro
 lugar é gasto na primeira manchete que passa, porque a história da tarde ainda não existe.</p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"Ao corrigir a repetição de notícias introduziste um defeito pior. Qual, e como o apanhaste?",
 a:`A primeira versão comparava o <b>texto do alerta renderizado</b>. Mas o alerta é quase todo
 <b>template</b> (cabeçalho, linhas de precedentes, a nota de não-previsão), portanto duas
 notícias <b>genuinamente diferentes</b> da mesma empresa partilham a maior parte das palavras —
 e a segunda seria suprimida <b>em silêncio</b>.
 <p>Ou seja: a correcção reproduzia o defeito que estava a corrigir, ao contrário.</p>
 <p>Apanhou-o <b>um teste que já existia</b>, o do tecto diário: passou a devolver 1 alerta onde
 esperava 2. A comparação passou a correr sobre a <b>manchete</b>, e recusa-se a julgar manchetes
 com poucas palavras de conteúdo — aí <b>falha aberto</b>, porque um alerta repetido custa ao
 leitor muito menos do que um alerta em falta.</p>`},

{b:"Decisões que tomei", n:1, t:"aberta",
 q:"Um alerta que se contradizia a si próprio. O que era, e porque é que nenhum teste o apanhava?",
 a:`Em <b>9 dos primeiros 30</b> alertas enviados, a linha de pares dizia <i>"outros nomes do setor
 moveram-se no mesmo sentido"</i> e <b>duas linhas abaixo</b> a decomposição dizia <i>"a maior parte
 deste movimento foi da empresa"</i>.
 <p>O caso mais gritante: <b>AMD −13,23%</b> com os pares a <code>−2,0%</code>, <code>−1,9%</code> e
 <code>−1,4%</code>.</p>
 <p><b>As duas linhas estavam certas.</b> A comparação com pares testava só a <b>direcção</b> e nunca
 a <b>dimensão</b> — logo uma direcção partilhada era reportada como uma explicação partilhada.</p>
 <p><b>Porque é que nenhum teste o apanhava:</b> é um defeito da <b>mensagem</b>, não de um
 componente. Nenhum componente está errado, portanto nenhum teste de componente pode falhar. Só
 aparece a ler alertas reais inteiros. Passa a comparar com a mediana dos pares e a dizer
 <i>"a direcção é partilhada; a dimensão não é"</i>.</p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"O ONNX rebentou em produção. Qual foi a causa, e que suposição tua a medição destruiu?",
 a:`O worker entrava em <b>ciclo de falha a 1,4 GB</b> num contentor de <b>512 MB</b>. Duas hipóteses
 minhas falharam (threads do motor de inferência; tamanho do ramo de dados). Só uma <b>sonda dentro
 do próprio contentor</b> mostrou que o arranque eram <b>281 MB</b> — o que punha o pico no
 <b>ciclo</b>, não na carga.
 <p><b>Causa:</b> o runner embebia <b>todas</b> as manchetes novas num único lote, e numa máquina sem
 estado anterior <b>todas</b> são novas. Na minha máquina o ficheiro de pendentes já existia, por
 isso o pico <b>nunca acontecia localmente</b>.</p>
 <p><b>A suposição destruída:</b> ia escrever que fatiar em lotes não altera resultados — os mesmos
 textos, a mesma saída. <b>É falso.</b> Com <code>int8</code>, o <i>padding</i> dentro do lote
 perturba a aritmética: diferenças até <code>0,022</code> no cosseno.</p>
 <p>Então testei a propriedade que <b>interessa</b> em vez de a assumir: <b>top-3 idêntico em 8 de
 8</b>. O produto deve os mesmos <b>vizinhos</b>, não vectores idênticos ao bit — e só uma dessas
 duas afirmações sobrevive à medição.</p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"Porque é que escreveste os critérios de aceitação ANTES do código?",
 a:`Porque a camada visível foi reconstruída várias vezes e <b>rejeitada sempre por critério
 estético</b> — e um critério estético <b>não tem condição de paragem</b>. Há sempre outra disposição
 para experimentar, e nenhuma versão pode alguma vez ser demonstrada como suficiente.
 <p>Passaram a ser escritos <b>antes</b>, num documento versionado, cada um formulado de modo a que
 <b>um teste ou uma medição</b> o decida, nunca uma opinião.</p>
 <p><b>E a prova de que a disciplina funciona é o seu custo:</b> um dos critérios revelou-se
 <b>errado</b> assim que a interface existiu — exigia o veredicto antes de <i>qualquer</i> número, o
 que obrigaria a esconder o <code>−7,64%</code>, que é o <b>facto que a frase explica</b>. Foi
 corrigido <b>por escrito</b>, com a razão registada.</p>
 <p><b>Um critério contornado em silêncio é indistinguível de um critério que nunca foi escrito.</b></p>`},

{b:"Decisões que tomei", n:2, t:"aberta",
 q:"Na decomposição, porque é que o setor é ortogonalizado, e porque é que o \\\"motor\\\" não é a maior componente?",
 a:`<b>Ortogonalização:</b> um ETF de setor e um índice largo são <b>fortemente colineares</b>. Sem
 ortogonalizar, os dois coeficientes absorvem a variância um do outro e a repartição
 mercado/setor/empresa fica <b>arbitrária</b> — os números somam na mesma, mas deixam de significar
 o que dizem significar.
 <p><b>O motor:</b> tomar a maior componente <b>em módulo</b> dá a resposta errada sempre que um
 factor puxa <b>ao contrário</b>. Medido: a NVDA subiu <code>+0,25%</code> com o setor a
 <code>−1,54%</code>. A maior em módulo era o setor — e dizer "foi o setor" seria <b>falso</b>, porque
 o setor estava a puxar para baixo num dia que subiu.</p>
 <p>O que explica um dia positivo são as <b>contribuições positivas</b>. Por isso o motor é a maior
 componente <b>com o mesmo sinal do total</b>, e as que puxaram ao contrário são reportadas à parte
 em vez de descartadas.</p>`},

{b:"Decisões que tomei", n:3, t:"aberta",
 q:"Porquê ONNX em produção, e como provaste que é o MESMO modelo?",
 a:`Porque as alternativas ingénuas eram más: manter a stack pesada (a app pública não corre)
 ou trocar por um modelo <b>diferente</b> em produção — o que é pior, porque a avaliação
 passaria a descrever um sistema que ninguém usa.
 <p>Exportei o <b>mesmo</b> modelo (ONNX int8, ~23 MB, CPU) e verifiquei a fidelidade sobre
 <b>503</b> consultas: cosseno <b>0,992</b> nos embeddings e <b>95% dos vizinhos partilhados</b>,
 com as divergências separadas por uma mediana de <b>0,006</b> de similaridade — empates, não temas
 diferentes.</p>
 <p>⚠️ Uma medição anterior dizia «top-3 idêntico em 20 de 23» e <b>não reproduz</b>: outra amostra
 de 23 dá 12. A instabilidade era do <b>tamanho da amostra</b>, não do motor — por isso a grandeza
 a citar é a quota de vizinhos partilhados, e não a contagem de listas exactamente iguais.</p>
 <p>Mais o <b>SHA256 fixado</b>: um download corrompido <b>falha fechado</b> em vez de mudar em
 silêncio o que o sistema entende por "semelhante".</p>`},

 <p>Como mecanismo de produto, a triagem melhora <b>1,67×</b> a precisão dentro do orçamento
 (0,632 vs 0,379). E um trabalho que só reporta o que correu bem é um trabalho em que não se
 pode confiar.</p>`},

{b:"As que doem", n:1, t:"aberta", q:"\"Construiu quatro coisas e não usou nenhuma.\"",

 <p>E quando a medição <b>sustentou</b>, liguei: o detector de volume saiu do mesmo estudo e
 está em produção. O critério foi registado <b>antes</b>, não depois de ver o resultado.</p>`},

{b:"As que doem", n:2, t:"aberta", q:"\"Isto é só integrar ferramentas existentes.\"",

 outro assunto conta como acerto, o que <b>inflaciona todas as linhas por igual</b> — incluindo

 <p>E o argumento principal da anomalia é <b>sem rótulo</b>, precisamente para não depender de

{b:"As que doem", n:2, t:"aberta", q:"\"Usou IA para escrever isto?\"",

 de engenharia e de escrita.
 <p>O que <b>não</b> foi delegado: as decisões, os critérios de aceitação escritos antes do

 <p>Responde com calma. A declaração honesta é mais forte do que qualquer negação.</p>`},

 <p>A frase que fecha: <b>"O modelo não sabe o que aconteceu. É-lhe dito — e cada número que

{b:"IA generativa", n:1, t:"aberta", q:"O que é um «pacote de evidência», e que campos tem cada facto?",
 a:`É tudo o que o gerador vê — e a única coisa que pode afirmar. Cada facto tem
 <b>id</b> (ex.: f3, que aparece no texto e se pode clicar), <b>valor</b>, e <b>origem</b>.
 <p>A origem é uma de três: <b>medido</b> (dados de mercado ou carimbo da fonte),
 <b>calculado</b> (fórmula determinística) ou <b>modelo</b> (saída de modelo treinado).</p>
 <p><b>Nenhum facto tem origem "gerado"</b> — o gerador contribui prosa e nunca um facto, e há

 q:"Quantos ataques adversários a guarda bloqueia, e quantos controlos de texto fiel aceita?",

/* ===================================================================== */
const K = "investigator-autoteste-v1";
let estado = carregar();
let fila = [], i = 0, revelado = false, escolhido = null;

function carregar() {
  try { return JSON.parse(localStorage.getItem(K)) || {res:{}, bloco:"", nivel:""}; }
  catch { return {res:{}, bloco:"", nivel:""}; }
}
function guardar() { try { localStorage.setItem(K, JSON.stringify(estado)); } catch {} }

/* Baralha com Fisher-Yates, mas so a ORDEM. As opcoes de escolha multipla
   ficam na ordem em que foram escritas de proposito: se a resposta certa
   andasse a saltar de posicao, decorava-se a posicao e nao o numero. */
function baralhar(a) {
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

function construirFila() {
  fila = baralhar(BANCO.map((p, idx) => ({...p, id: idx}))
    .filter(p => (!estado.bloco || p.b === estado.bloco)
              && (!estado.nivel || String(p.n) === estado.nivel)));
  i = 0; revelado = false; escolhido = null;
}

const NIVEL = {1:["🔴 saber de cor","t1"], 2:["🟡 saber explicar","t2"], 3:["🟢 conhecer","t3"]};

function pintar() {
  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  fila.forEach((p, k) => {
    const d = document.createElement("div");
    const r = estado.res[p.id];
    d.className = "tick" + (k === i && !revelado ? " now" : r === true ? " ok" : r === false ? " no" : "");
    strip.appendChild(d);
  });

  const feitas = fila.filter(p => estado.res[p.id] !== undefined);
  const certas = feitas.filter(p => estado.res[p.id] === true).length;
  document.getElementById("pos").textContent =
    fila.length ? `${Math.min(i + 1, fila.length)} / ${fila.length}` : "0 / 0";
  document.getElementById("placar").textContent =
    feitas.length ? `${certas}/${feitas.length} certas` : "por começar";

  const palco = document.getElementById("palco");

  if (i >= fila.length) {
    const falhadas = fila.filter(p => estado.res[p.id] === false);
    const pct = feitas.length ? Math.round(100 * certas / feitas.length) : 0;
    palco.innerHTML = `
      <div class="card done">
        <div class="sub">Ronda terminada</div>
        <div class="score" style="color:${pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--flag)" : "var(--no)"}">${pct}%</div>
        <div class="sub">${certas} de ${feitas.length} respondidas correctamente.</div>
        ${falhadas.length ? `<div class="miss"><h3>Repete só estas</h3><ul>${
          falhadas.map(p => `<li>${p.q}</li>`).join("")}</ul></div>` : `
          <div class="sub" style="margin-top:14px">Sem falhas nesta ronda.
          Faz outra volta amanhã — o que se recupera no dia seguinte é o que fica.</div>`}
      </div>
      <div class="actions">
        ${falhadas.length ? `<button class="big primary" id="soFalhadas">Repetir as ${falhadas.length} falhadas</button>` : ""}
        <button class="big" id="tudoDeNovo">Ronda nova</button>
      </div>`;
    const sf = document.getElementById("soFalhadas");
    if (sf) sf.onclick = () => { fila = baralhar(falhadas.slice()); i = 0; revelado = false; escolhido = null; pintar(); };
    document.getElementById("tudoDeNovo").onclick = () => { construirFila(); pintar(); };
    return;
  }

  const p = fila[i];
  const [rot, cls] = NIVEL[p.n];
  let corpo = `
    <div class="card">
      <div class="tags"><span class="tag ${cls}">${rot}</span><span class="tag">${p.b}</span></div>
      <p class="q">${p.q}</p>`;

  if (p.t === "escolha") {
    corpo += `<div class="opts">` + p.opts.map((o, k) => {
      let c = "opt", badge = "";
      if (revelado) {
        if (k === p.ok) { c += " right"; badge = "certo"; }
        else if (k === escolhido) { c += " wrong"; badge = "a tua"; }
      }
      return `<button class="${c}" data-k="${k}" ${revelado ? "disabled" : ""}>
        <span class="val">${o}</span>${badge ? `<span class="badge">${badge}</span>` : ""}</button>`;
    }).join("") + `</div>`;
  } else if (!revelado) {
    corpo += `<p class="hint">Responde <b>em voz alta</b> antes de abrir.
      Ler a resposta cria a ilusão de a saber; dizê-la primeiro é o que a fixa.</p>`;
  }

  if (revelado) corpo += `<div class="answer">${p.a}</div>`;
  corpo += `</div>`;

  if (!revelado && p.t !== "escolha") {
    corpo += `<div class="actions"><button class="big primary" id="mostrar">Mostrar resposta</button></div>`;
  } else if (revelado) {
    corpo += p.t === "escolha"
      ? `<div class="actions"><button class="big primary" id="seguinte">Seguinte</button></div>`
      : `<div class="actions">
           <button class="big no" id="falhei">Falhei</button>
           <button class="big yes" id="acertei">Sabia</button>
         </div>`;
  }

  palco.innerHTML = corpo;

  const mostrar = document.getElementById("mostrar");
  if (mostrar) mostrar.onclick = () => { revelado = true; pintar(); };

  palco.querySelectorAll(".opt").forEach(b => {
    b.onclick = () => {
      escolhido = +b.dataset.k;
      revelado = true;
      estado.res[p.id] = escolhido === p.ok;
      guardar(); pintar();
    };
  });

  const marcar = ok => { estado.res[p.id] = ok; guardar(); i++; revelado = false; escolhido = null; pintar(); };
  const a = document.getElementById("acertei"), f = document.getElementById("falhei");
  if (a) a.onclick = () => marcar(true);
  if (f) f.onclick = () => marcar(false);
  const s = document.getElementById("seguinte");
  if (s) s.onclick = () => { i++; revelado = false; escolhido = null; pintar(); };
}

/* ------------------------------------------------------------- arranque */
const fb = document.getElementById("fBloco");
fb.innerHTML = `<option value="">Todos os blocos</option>` +
  [...new Set(BANCO.map(p => p.b))].map(b => `<option value="${b}">${b}</option>`).join("");
fb.value = estado.bloco || "";
document.getElementById("fNivel").value = estado.nivel || "";

fb.onchange = e => { estado.bloco = e.target.value; guardar(); construirFila(); pintar(); };
document.getElementById("fNivel").onchange = e => {
  estado.nivel = e.target.value; guardar(); construirFila(); pintar();
};
document.getElementById("reiniciar").onclick = () => {
  if (confirm("Apagar o progresso guardado e começar de novo?")) {
    estado.res = {}; guardar(); construirFila(); pintar();
  }
};
document.getElementById("tema").onclick = () => {
  const r = document.documentElement;
  const escuro = r.getAttribute("data-theme") === "dark"
    || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme", escuro ? "light" : "dark");
};

construirFila();
pintar();
</script>
