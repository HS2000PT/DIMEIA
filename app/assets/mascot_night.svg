<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="InvestiGator by night — the gator eye half-lidded under a crescent moon, still watching the market line">
  <!-- Mascote NOITE: "The Stare" a dormitar (olho mais fechado) sob uma lua crescente e
       estrelas, palete mais fria. Mesma marca, estado noturno — "nunca dorme mesmo". -->
  <defs>
    <linearGradient id="ig-night-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2233"/>
      <stop offset="1" stop-color="#071620"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="61" fill="url(#ig-night-bg)"/>
  <!-- lua crescente ao canto superior direito (disco + carve deslocado = crescente fiável) -->
  <circle cx="206" cy="52" r="17" fill="#E9E5CE"/>
  <circle cx="215" cy="47" r="15" fill="#0A1E2B"/>
  <!-- estrelas -->
  <g fill="#CFE3EF">
    <circle cx="166" cy="40" r="2.4"/>
    <circle cx="150" cy="60" r="1.8"/>
    <circle cx="182" cy="74" r="1.8"/>
  </g>
  <!-- sobrolho pesado (mais baixo, sonolento) -->
  <path d="M64 114 L128 92 L192 114" fill="none" stroke="#6FB7C9" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- olho mais fechado (amêndoa achatada) -->
  <path d="M70 140 Q128 120 186 140 Q128 160 70 140 Z" fill="#6FB7C9"/>
  <!-- íris dourada suave + pupila em fenda + brilho ténue -->
  <circle cx="128" cy="140" r="20" fill="#D9AE58"/>
  <rect x="122" y="123" width="12" height="34" rx="6" fill="#08131B"/>
  <circle cx="121" cy="132" r="4" fill="#F3E7C6"/>
  <!-- linha de mercado a subir (mais fria à noite) -->
  <polyline points="56,208 104,208 134,208 160,190 190,200 216,172" fill="none"
            stroke="#3FB7B0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
