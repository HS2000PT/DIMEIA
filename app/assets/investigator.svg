<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InvestiGator — a friendly detective alligator mascot">
  <!-- InvestiGator mascot: a silly, friendly Sherlock-style investigator alligator.
       Hand-drawn flat SVG, no external assets. Palette: gator greens + detective browns. -->

  <!-- ear-flap bow of the deerstalker (behind the dome) -->
  <g stroke="#6D4C41" stroke-width="6" fill="#8D6E63">
    <path d="M236 96 q20 -26 40 0 q-20 14 -40 0 z"/>
  </g>

  <!-- head base -->
  <ellipse cx="256" cy="300" rx="152" ry="122" fill="#58A55C"/>
  <!-- jaw / belly tint -->
  <ellipse cx="256" cy="352" rx="118" ry="66" fill="#A5D6A7"/>

  <!-- eye bumps -->
  <circle cx="188" cy="196" r="50" fill="#58A55C"/>
  <circle cx="324" cy="196" r="50" fill="#58A55C"/>

  <!-- deerstalker hat (dome + front brim + plaid) -->
  <path d="M132 150 q124 -108 248 0 l-14 22 q-110 -70 -220 0 z" fill="#8D6E63"/>
  <path d="M150 158 q106 -84 212 0 q-106 -52 -212 0 z" fill="#795548"/>
  <ellipse cx="256" cy="158" rx="132" ry="18" fill="#6D4C41"/>
  <!-- plaid hint -->
  <g stroke="#5D4037" stroke-width="4" opacity="0.5">
    <path d="M196 118 q0 20 6 34"/>
    <path d="M256 100 v46"/>
    <path d="M316 118 q0 20 -6 34"/>
    <path d="M170 138 q86 -34 172 0"/>
  </g>

  <!-- eyes -->
  <circle cx="188" cy="200" r="30" fill="#FFFFFF"/>
  <circle cx="324" cy="200" r="30" fill="#FFFFFF"/>
  <circle cx="192" cy="204" r="12" fill="#263238"/>
  <circle cx="320" cy="204" r="12" fill="#263238"/>
  <circle cx="196" cy="199" r="4" fill="#FFFFFF"/>
  <circle cx="324" cy="199" r="4" fill="#FFFFFF"/>
  <!-- friendly eyebrows: one raised (curious detective look) -->
  <path d="M162 166 q26 -14 52 -4" stroke="#2E7D32" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M298 156 q26 -10 52 2" stroke="#2E7D32" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- monocle on the right eye -->
  <circle cx="324" cy="200" r="40" fill="none" stroke="#C9A227" stroke-width="7"/>
  <path d="M356 226 q18 34 4 62" stroke="#C9A227" stroke-width="5" fill="none"/>

  <!-- nostrils -->
  <ellipse cx="222" cy="312" rx="9" ry="6" fill="#2E7D32"/>
  <ellipse cx="290" cy="312" rx="9" ry="6" fill="#2E7D32"/>

  <!-- smile with silly teeth -->
  <path d="M160 352 q96 66 192 0" stroke="#2E7D32" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M204 372 l12 20 l14 -16 z" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/>
  <path d="M296 374 l10 20 l14 -18 z" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/>

  <!-- bow tie -->
  <g fill="#6D4C41" stroke="#5D4037" stroke-width="4">
    <path d="M216 428 l32 14 l-32 16 q-10 -16 0 -30 z"/>
    <path d="M296 428 l-32 14 l32 16 q10 -16 0 -30 z"/>
    <circle cx="256" cy="443" r="9" fill="#8D6E63"/>
  </g>

  <!-- magnifying glass (front, bottom-right) -->
  <g>
    <rect x="404" y="404" width="86" height="26" rx="13" transform="rotate(45 404 404)" fill="#795548" stroke="#5D4037" stroke-width="4"/>
    <circle cx="386" cy="386" r="62" fill="#BBDEFB" fill-opacity="0.45" stroke="#C9A227" stroke-width="11"/>
    <path d="M352 360 q14 -16 34 -14" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
