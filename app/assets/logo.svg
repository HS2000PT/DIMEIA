<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="InvestiGator — a rising market line drawn as an alligator's ridged tail">
  <!-- InvestiGator — marca "The Tail" (2026-07-29).
       UM traço contínuo que se lê ao mesmo tempo como a cauda serrilhada de um jacaré e como
       uma linha de mercado a subir: a base espessa em baixo-à-esquerda afina até à ponta em
       cima-à-direita, e os dentes do bordo superior são simultaneamente escamas e volatilidade.

       Substitui "The Stare" (olho de crocodilo), que falhava a 16 px — o sobrolho fundia-se
       com o olho e a linha de mercado desaparecia — e cujo olho de pupila em fenda lia-se como
       predador, contra-mensagem para um produto cuja ética é mostrar evidência, nunca caçar.

       GLIFO NU, sem contentor: um quadrado escuro obrigaria um bloco a toda a superfície clara
       onde a marca aterrasse. O contentor volta só no ícone de aplicação (icon.svg), onde a
       plataforma o exige. Para fundos escuros usar logo-dark.svg; monocromático em logo-mono.svg. -->
  <path d="M22 206 C 74 202, 122 180, 158 142 C 182 116, 202 86, 226 52
           L 214 46 L 202 70 L 186 60 L 170 88 L 152 78 L 134 108 L 112 98
           L 92 130 L 66 120 L 44 154 L 16 146 Z"
        fill="#0A8F52"/>
</svg>
