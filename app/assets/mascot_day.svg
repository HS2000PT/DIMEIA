<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="InvestiGator by day — the watchful gator eye under a bright sun over a rising market line">
  <!-- Mascote DIA: "The Stare" acordada e alerta, com um sol quente ao canto. Mesma marca
       (olho de crocodilo, íris dourada, linha de mercado a subir), estado diurno. -->
  <defs>
    <linearGradient id="ig-day-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A2B"/>
      <stop offset="1" stop-color="#0C271D"/>
    </linearGradient>
    <radialGradient id="ig-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#F2B33C"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="61" fill="url(#ig-day-bg)"/>
  <!-- sol ao canto superior direito (raios + disco) -->
  <g stroke="#F4C25A" stroke-width="5" stroke-linecap="round">
    <line x1="205" y1="34" x2="205" y2="22"/>
    <line x1="205" y1="82" x2="205" y2="70"/>
    <line x1="181" y1="52" x2="169" y2="52"/>
    <line x1="241" y1="52" x2="229" y2="52"/>
    <line x1="188" y1="35" x2="180" y2="27"/>
    <line x1="230" y1="69" x2="222" y2="61"/>
    <line x1="222" y1="35" x2="230" y2="27"/>
    <line x1="180" y1="69" x2="188" y2="61"/>
  </g>
  <circle cx="205" cy="52" r="16" fill="url(#ig-sun)"/>
  <!-- sobrolho investigativo -->
  <path d="M62 108 L128 82 L194 108" fill="none" stroke="#8BE0B2" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- olho amendoado, bem aberto -->
  <path d="M67 139 Q128 103 189 139 Q128 175 67 139 Z" fill="#8BE0B2"/>
  <!-- íris dourada + pupila em fenda + brilho -->
  <circle cx="128" cy="139" r="28" fill="#F0BE55"/>
  <rect x="121" y="115" width="14" height="48" rx="7" fill="#0B1F17"/>
  <circle cx="119" cy="129" r="5" fill="#FFF3D6"/>
  <!-- linha de mercado a subir -->
  <polyline points="56,208 104,208 134,208 160,190 190,200 216,172" fill="none"
            stroke="#33D983" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
