# Tema de marca do InvestiGator (2026-07-22): verde-pântano + dourado do logo "The Stare"
# (app/assets/logo.svg). Só cores — sem CSS hacks; o Streamlit Cloud lê este ficheiro sozinho.
[theme]
primaryColor = "#E7B24C"             # dourado investigador (a íris do olho / botões)
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3EF" # verde muito claro (painéis/sidebar, discreto)
textColor = "#0E2A20"                # verde-pântano quase-preto (o fundo do logo)

[browser]
gatherUsageStats = false
