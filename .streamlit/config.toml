# Tema de marca do InvestiGator (2026-07-13): navy + esmeralda do logo (app/assets/logo.svg).
# Só cores — sem CSS hacks; o Streamlit Cloud lê este ficheiro automaticamente.
[theme]
primaryColor = "#10B981"            # esmeralda (a linha de mercado do logo)
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9" # slate-100 (painéis/sidebar, discreto)
textColor = "#0F172A"               # navy-quase-preto (o quadrado do logo)

[browser]
gatherUsageStats = false
