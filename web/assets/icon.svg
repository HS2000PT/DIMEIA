<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="InvestiGator app icon">
  <!-- Ícone de APLICAÇÃO: favicon, separador do browser, avatar do canal Telegram.
       É o único sítio onde o contentor volta, porque a plataforma desenha sempre um quadrado
       e sem fundo próprio a marca ficaria à mercê da cor de sistema do utilizador.

       O glifo é ampliado e recentrado face ao logo.svg: um ícone lido a 16 px precisa de
       margens menores do que uma marca lida a 88 px. Foi este o teste que "The Stare" falhou. -->
  <rect width="256" height="256" rx="58" fill="#0A0E12"/>
  <g transform="translate(128 128) scale(1.14) translate(-128 -128)">
    <path d="M22 206 C 74 202, 122 180, 158 142 C 182 116, 202 86, 226 52
             L 214 46 L 202 70 L 186 60 L 170 88 L 152 78 L 134 108 L 112 98
             L 92 130 L 66 120 L 44 154 L 16 146 Z"
          fill="#00E37A"/>
  </g>
</svg>
