<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvestiGator — market intelligence</title>
<meta name="description" content="Explainable market intelligence: measured statistics, learned models, and generated synthesis with the evidence attached.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<header class="top">
  <a class="brand" href="/" data-nav>
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M3 22c5.2 0 7.4-4.8 10.4-9.2C16 8.9 19.4 6 24 6c3 0 5 1.4 5 3.6 0 2-1.7 3.4-4 3.4"
            stroke="var(--up)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <b>InvestiGator</b><span>&nbsp;v5</span>
  </a>

  <span class="pill shut" id="mkt"><i class="dot"></i><span id="mkt-t">…</span></span>
  <span class="dim" id="asof" style="font-size:var(--t-xs)"></span>

  <span class="spacer"></span>

  <button class="tbtn" id="nav-screener" title="Every name the scan looked at, and the gate that stopped it">
    Screener
  </button>
  <button class="tbtn" id="nav-method" title="The frozen evaluation numbers, each tied to the file that produced it">
    Method
  </button>
  <button class="tbtn" id="theme" title="Light / dark" aria-label="Toggle theme">◐</button>
  <button class="tbtn ai" id="toggle-rail">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0.8l1.6 4.3 4.3 1.6-4.3 1.6L8 12.6 6.4 8.3 2.1 6.7l4.3-1.6L8 .8zM13.2 10.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9z"/>
    </svg>
    Intelligence
  </button>
</header>

<div class="shell">
  <main class="main"><div class="wrap" id="view"></div></main>

  <aside class="rail" id="rail" hidden aria-label="Intelligence panel">
    <div class="rail-head">
      <div class="rail-tabs" role="tablist">
        <button class="rail-tab" id="tab-report" role="tab" aria-selected="true">Report</button>
        <button class="rail-tab" id="tab-chat" role="tab" aria-selected="false">Analyst</button>
      </div>
      <button class="x" id="close-rail" aria-label="Close panel">✕</button>
    </div>
    <div class="rail-body" id="rail-body"></div>
    <div class="rail-foot" id="rail-foot" hidden>
      <form class="ask" id="ask-form">
        <textarea id="ask-input" rows="1" placeholder="Ask about what you are looking at…"
                  aria-label="Ask the analyst"></textarea>
        <button class="send" type="submit" id="ask-send" aria-label="Send">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M1.7 14.3L15 8 1.7 1.7 1.7 6.6 11 8l-9.3 1.4z"/>
          </svg>
        </button>
      </form>
    </div>
  </aside>
</div>

<div id="portal"></div>

<script src="/assets/vendor/lightweight-charts.js"></script>
<script src="/assets/app.js" type="module"></script>
</body>
</html>
