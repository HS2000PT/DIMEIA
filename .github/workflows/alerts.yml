name: Alerts (scheduled scan)

# Varre a watchlist (config/alerts.yaml) e envia alertas explicáveis para o Telegram.
# Free: em repositório público os minutos do GitHub Actions são gratuitos. NÃO precisa de servidor.
# Seguro: se os segredos do Telegram não estiverem definidos, o runner imprime e sai 0 (job verde,
# nada é enviado). Define os segredos em Settings -> Secrets and variables -> Actions.
# Ver docs/design/going_live.md. Nenhum segredo no YAML.
#
# INTRADIÁRIO (zero-ops): corre de 30 em 30 min durante o horário de mercado US (13:00–21:30 UTC
# cobre verão e inverno) + a varredura de fecho. O runner lembra-se do que JÁ alertou hoje via
# data/alerts_state.json, persistido entre corridas pela cache do Actions (jobs são efémeros) —
# a mesma anomalia/manchete nunca repete no mesmo dia. Os comandos do bot (/watch …) também são
# processados em cada corrida (resposta ≤30 min; para respostas imediatas: scripts/run_bot.py).
# Cron é UTC e "best-effort" (pode atrasar alguns minutos); pausa após 60 dias sem commits.
#
# HISTÓRICO PARTILHADO (sync com a app pública): cada alerta realmente enviado é acrescentado a
# `alerts_history.jsonl` na branch `alerts-history` (dados, não código — mantém a história do
# `main` limpa). A app Streamlit lê esse ficheiro ao vivo via raw.githubusercontent.com — nunca
# recalcula, só mostra o que já foi enviado. Ver investigator/alerts_history.py.

on:
  schedule:
    # De 30 em 30 min, 13:00–21:30 UTC, dias úteis (mercado US: 13:30/14:30 → 20:00/21:00 UTC).
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch: {}   # botão "Run workflow" para testar à mão

# Escrita necessária para publicar o histórico partilhado na branch `alerts-history` (dados).
permissions:
  contents: write

concurrency:
  group: alerts-scan
  cancel-in-progress: false   # corridas em fila, nunca duas em paralelo (estado consistente)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Checkout à parte da branch de dados (nunca a de código) — a única escrita deste
      # workflow acontece aqui dentro, isolada do checkout principal.
      - name: Checkout shared alert history
        uses: actions/checkout@v4
        continue-on-error: true   # se falhar (branch em falta/renomeada), o runner segue sem histórico partilhado
        with:
          ref: alerts-history
          path: history

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Modelo semântico MiniLM em ONNX (~23 MB, imutável — chave constante): com a cache
      # quente o download nunca acontece; num miss o runner descarrega-o UMA vez, com SHA256
      # verificado. Se tudo falhar, o retrieval degrada para word-overlap (fail-open no código).
      - name: Cache the ONNX semantic model
        uses: actions/cache@v4
        with:
          path: models/onnx
          key: onnx-minilm-quint8-v1

      # Estado intradiário entre corridas (caches são imutáveis → chave única por corrida,
      # restore-keys apanha a mais recente; o próprio ficheiro zera as listas ao mudar o dia).
      # Persiste ENTRE corridas: o estado do dia + a base de subscritores do bot
      # (o runner é efémero — sem isto, os /watch dos utilizadores perder-se-iam).
      - name: Restore intraday state + subscribers
        uses: actions/cache/restore@v4
        with:
          path: |
            data/alerts_state.json
            data/bot_users.db
          key: alerts-state-${{ github.run_id }}
          restore-keys: |
            alerts-state-

      - name: Run the alert scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          INVESTIGATOR_HISTORY_PATH: history/alerts_history.jsonl
        run: python scripts/run_alerts.py

      - name: Save intraday state + subscribers
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/alerts_state.json
            data/bot_users.db
          key: alerts-state-${{ github.run_id }}

      # Publica o histórico partilhado só se houve algo novo E o checkout acima correu bem
      # (fail-open total: nunca impede o resto do job nem falha por si só).
      - name: Publish updated alert history
        if: always()
        continue-on-error: true
        run: |
          if [ ! -d history/.git ]; then
            echo "[historico] checkout da branch de dados indisponível — nada a publicar."
            exit 0
          fi
          cd history
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alerts_history.jsonl
            git commit -m "Alertas: atualização automática do histórico partilhado"
            git push
          else
            echo "[historico] sem alterações — nada para publicar."
          fi
