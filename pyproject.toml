# Configuração de ferramentas (ruff + pytest). Sem empacotamento — projeto baseado em scripts.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-q", "-m", "not telegram and not sbert"]
testpaths = ["tests"]
markers = [
  "telegram: envia mensagem real via Telegram (requer .env; correr com 'pytest -m telegram')",
  "sbert: usa o SBERT real (descarrega modelo; pesado — correr com 'pytest -m sbert')",
]
