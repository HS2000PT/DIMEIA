# alerts.yaml — definições do sistema de alertas agendado (scripts/run_alerts.py)
#
# SÓ definições (não-secretas). Os segredos (token do bot, id do canal, chave do Finnhub) vivem
# em GitHub Actions Secrets ou no .env local — NUNCA aqui. Ver docs/design/going_live.md.
#
# O gatilho de mercado corre 1x/dia (após o fecho dos EUA) e avisa dos tickers com movimento
# anómalo (z-score fora de ±limiar) — sem estado, um alerta por ticker por dia.

market:
  enabled: true
  # A tua watchlist. Edita à vontade (símbolos NYSE/NASDAQ suportados pelo yfinance).
  tickers: [AAPL, MSFT, NVDA, TSLA, AMZN, GOOGL, META, JPM, AMD, NFLX]
  window: 20        # dias anteriores usados para média/desvio (a "norma")
  threshold: 3.0    # |z| acima do qual é anomalia
  # Só avaliar quando a última barra de preços é de HOJE (true por defeito): evita repetir
  # num feriado o alerta da sessão anterior e "avaliar" dados estagnados.
  # require_fresh_bar: true

# Gatilho de notícias (opcional): precisa de FINNHUB_API_KEY. É "best-effort" — sem memória do
# que já foi enviado nesta fase, por isso pode repetir. Deixa 'false' até quereres experimentar.
news:
  enabled: true            # canal com notícias (ligado no "produto zero-ops", 2026-07-06)
  tickers: [AAPL, MSFT, NVDA, TSLA, AMZN, GOOGL, META, JPM, AMD, NFLX]
  horizon: 5        # horizonte do impacto dos precedentes (+5 dias)
  top_k: 3          # nº de precedentes a mostrar
  # Triagem APRENDIDA (RQ4; off por defeito). Se definires um número em [0,1], cada alerta
  # de notícia é pontuado pelo modelo só-contexto (models/triage_context_lr.joblib, stack
  # leve) e só é enviado se P(movimento anormal) ≥ min_materiality; a linha de materialidade
  # passa a acompanhar o alerta. null = desligado (comportamento de sempre, sem modelo).
  # LIGADO em produção como controlo de fadiga de alertas: só passa notícia com
  # P(movimento anormal) ≥ 0.5 segundo o modelo treinado (RQ4). Fail-open sem modelo.
  min_materiality: 0.5
  # Anti-repetição: só alerta notícias com ≤ este nº de dias (o scan olha 7 dias para trás,
  # mas sem isto a MESMA manchete podia alertar dias a fio). 2 cobre o fim de semana.
  # max_age_days: 2

# Fase B (opcional; off por defeito): distribuir os alertas TAMBÉM por subscritor do bot
# interativo. Os utilizadores registam-se falando com o bot (/start, /watch TSLA) enquanto
# `python scripts/run_bot.py` estiver a correr (long-polling; não precisa de servidor).
# Sem base de subscritores, ou com enabled: false, o runner comporta-se como sempre (só canal).
bot:
  enabled: true   # comandos processados em lote em cada varredura + fan-out por subscritor
  # db: data/bot_users.db   # caminho da base (defeito; gitignored)

# Dados PÚBLICOS do produto (não-secretos; o canal é público por definição).
# Preenche com o link do teu canal para a app mostrar o botão "Open the Telegram channel".
public:
  channel_url: null   # ex.: https://t.me/investigator_alerts
