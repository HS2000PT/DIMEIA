# alerts.yaml — definições do sistema de alertas agendado (scripts/run_alerts.py)
#
# SÓ definições (não-secretas). Os segredos (token do bot, id do canal, chave do Finnhub) vivem
# em GitHub Actions Secrets ou no .env local — NUNCA aqui. Ver docs/design/going_live.md.
#
# O gatilho de mercado corre 1x/dia (após o fecho dos EUA) e avisa dos tickers com movimento
# anómalo (z-score fora de ±limiar) — sem estado, um alerta por ticker por dia.

market:
  enabled: true
  # A tua watchlist. Edita à vontade (símbolos NYSE/NASDAQ suportados pelo yfinance).
  # 2026-08-03: 10 → 12, e os dois nomes novos são NÃO-TECNOLÓGICOS de propósito. Nove dos
  # dez anteriores partilhavam o mesmo ETF de setor (XLK), portanto a decomposição
  # mercado/setor/empresa respondia quase sempre a mesma coisa à pergunta "foi o setor?" —
  # não porque a resposta fosse essa, mas porque a watchlist não tinha outra por onde
  # variar. XOM traz o XLE (energia) e JNJ o XLV (saúde), dois factores que se movem por
  # razões diferentes das do tecnológico. É melhoria de TESE, não de disposição no ecrã.
  tickers: [AAPL, MSFT, NVDA, TSLA, AMZN, GOOGL, META, JPM, AMD, NFLX, XOM, JNJ]
  window: 20        # dias anteriores usados para média/desvio (a "norma")
  # |z| acima do qual é anomalia. A tese AVALIA e congela os números em threshold=3.0
  # (docs/evaluation/evaluation_anomaly.md — nunca mudam). Este é um parâmetro de
  # IMPLANTAÇÃO, separado da avaliação (decisão de produto, divulgada; ajusta à vontade).
  # 2026-07-13: 1.5 — o pedido real do investidor é "alertas frequentes para acompanhar";
  # o texto do alerta compensa com NÍVEIS de severidade (notable ≥1.5 < strong ≥2.0 <
  # extreme ≥3.0 — o congelado da tese é o degrau máximo), para 1.6 nunca parecer 3.2.
  threshold: 1.5
  # Só avaliar quando a última barra de preços é de HOJE (true por defeito): evita repetir
  # num feriado o alerta da sessão anterior e "avaliar" dados estagnados. NOTA: as fontes
  # de fallback (Tiingo/Polygon/…) podem atrasar a barra de hoje — nesses ciclos o caminho
  # de fecho salta e o INTRADIÁRIO cobre (a cotação Finnhub é sempre fresca).
  require_fresh_bar: true
  # Deteção INTRADIÁRIA: o retorno de HOJE em curso (cotação Finnhub em tempo real vs fecho
  # anterior) avaliado contra a norma diária — o mesmo z-score, mais cedo. "Caiu 4,8% em
  # 12 min" alerta em minutos, não ao fecho. Desde 2026-07-13 corre TAMBÉM nas corridas
  # agendadas do Actions (30 em 30 min em horário de mercado), não só no --watch — é o
  # caminho de mercado que não depende do yfinance.
  intraday:
    enabled: true
    # threshold próprio (defeito: o threshold de cima)
    # threshold: 2.0

# Gatilho de notícias (opcional): precisa de FINNHUB_API_KEY. É "best-effort" — sem memória do
# que já foi enviado nesta fase, por isso pode repetir. Deixa 'false' até quereres experimentar.
news:
  enabled: true            # canal com notícias (ligado no "produto zero-ops", 2026-07-06)
  # Espelha a watchlist de mercado (ver a nota lá em cima sobre os dois nomes não-tecnológicos).
  tickers: [AAPL, MSFT, NVDA, TSLA, AMZN, GOOGL, META, JPM, AMD, NFLX, XOM, JNJ]
  horizon: 5        # horizonte do impacto dos precedentes (+5 dias)
  top_k: 3          # nº de precedentes a mostrar
  # Triagem APRENDIDA (RQ4; off por defeito). Se definires um número em [0,1], cada alerta
  # de notícia é pontuado pelo modelo só-contexto (models/triage_context_lr.joblib, stack
  # leve) e só é enviado se P(movimento anormal) ≥ min_materiality; a linha de materialidade
  # passa a acompanhar o alerta. null = desligado (comportamento de sempre, sem modelo).
  # LIGADO em produção como controlo de fadiga de alertas: só passa notícia com
  # P(movimento anormal) ≥ 0.5 segundo o modelo treinado (RQ4). Fail-open sem modelo.
  min_materiality: 0.5
  # Anti-repetição: só alerta notícias com ≤ este nº de dias (o scan olha 7 dias para trás,
  # mas sem isto a MESMA manchete podia alertar dias a fio). 2 cobre o fim de semana.
  # max_age_days: 2
  # Chão de similaridade (qualidade > volume, 2026-07-11): sem UM precedente com cosseno
  # ≥ este valor, o alerta é suprimido — evidência fraca parecia aleatória, com razão.
  min_similarity: 0.45
  # Teto de alertas de notícia por ticker por dia (anti-fadiga; 12/dia do mesmo ticker
  # ensinam o utilizador a ignorar o canal). O filtro de relevância corta o resto.
  max_per_ticker_per_day: 2
  # KB VIVA + decaimento por idade ("timeline matters", 2026-07-11): o retrieval funde a
  # KB viva (casos capturados pelo próprio runner e maturados a +5d) com a KB histórica,
  # ordenando por cosseno × 0.5^(idade/half_life). A similaridade MOSTRADA é sempre o
  # cosseno real; a idade aparece em cada precedente.
  # 2026-07-13: 365 → 120 ("só o presente interessa"): um caso de 2018 cai para peso
  # ~0.000004 vs ~0.6 de um caso de 3 meses — precedentes recentes ganham SEMPRE o
  # desempate quando a KB viva tiver casos; os históricos continuam a aparecer quando são
  # os únicos no tema (decisão de produto, divulgada).
  recency_half_life_days: 120
  # Corte duro de idade (dias). null = sem corte. NOTA: só faz sentido definir (ex.: 730)
  # quando a KB viva já tiver meses de casos — antes disso cortaria quase tudo.
  # Rever ~agosto/2026 (a KB viva começa a maturar ~2026-07-17).
  max_precedent_age_days: null

# NARRADOR ANCORADO (opcional; off por defeito). Antepõe ao alerta um parágrafo em linguagem
# simples gerado por LLM — mas o LLM só escreve a LÍNGUA, nunca os factos: todos os números
# vêm dos motores e uma guarda de fidelidade (vocabulário fechado + números com sinal
# obrigatório) rejeita qualquer resposta que invente, inverta a direção, ou aconselhe.
# Ver docs/design/narrator_guard.md e docs/evaluation/evaluation_narrator.md.
#
# Precisa de GROQ_API_KEY e/ou GEMINI_API_KEY (ver docs/design/keys.md). É ADITIVO e
# fail-open: sem chaves, com o LLM em baixo, ou com a guarda a rejeitar, o alerta sai
# EXATAMENTE como sai hoje. Ligar quando quiseres ver o parágrafo no canal.
narrator:
  enabled: false

# Fase B (opcional; off por defeito): distribuir os alertas TAMBÉM por subscritor do bot
# interativo. Os utilizadores registam-se falando com o bot (/start, /watch TSLA) enquanto
# `python scripts/run_bot.py` estiver a correr (long-polling; não precisa de servidor).
# Sem base de subscritores, ou com enabled: false, o runner comporta-se como sempre (só canal).
bot:
  enabled: true   # comandos processados em lote em cada varredura + fan-out por subscritor
  # db: data/bot_users.db   # caminho da base (defeito; gitignored)

# Dados PÚBLICOS do produto (não-secretos; o canal é público por definição).
public:
  # Link do canal — a app mostra o botão "Open the Telegram channel".
  channel_url: https://t.me/InvestiGatorMEIA
  # URL raw do histórico partilhado (branch `alerts-history`, escrita pelo workflow) — a app
  # lê-o ao vivo em vez de recalcular alertas; muda só se migrares/renomeares o repositório.
  history_url: https://raw.githubusercontent.com/HS2000PT/DIMEIA/alerts-history/alerts_history.jsonl
